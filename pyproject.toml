[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fireprotect-automation"
version = "0.5.0"
description = "Автоматизация проектов огнезащиты стальных конструкций"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<3.2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<10",
    "ruff>=0.8,<1",
    "types-openpyxl>=3.1,<4",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
fireprotect = "fireprotect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
